# Python workspace for OpenChart AI services (apps/api now; worker and
# voice join in later milestones).

[tool.uv.workspace]
members = ["apps/api"]

[tool.uv]
# Supply-chain guard: only resolve distributions uploaded at least 14 days ago.
exclude-newer = "14 days"
# Reviewed exceptions for security fixes younger than 14 days. Each entry was
# checked by reading the release's diff; remove it once the release is older
# than the general cut-off.
#   pyasn1 0.6.5 (2026-10-27): fixes CVE-2026-119194/119195/119196/119197
#   (quadratic CPU in the BER/DER decoders). Diff limited to
#   codec/ber/decoder.py, no new imports or I/O. Reviewed 2026-10-31.
exclude-newer-package = { pyasn1 = "2026-10-28T00:00:00Z" }

[dependency-groups]
dev = [
    "httpx2",
    "mypy",
    "pytest",
    "ruff",
]
# Freezes the API into one folder for the desktop app (apps/api/scripts/freeze.py).
desktop = ["pyinstaller"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "S", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["openchart_api"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
files = ["apps/api/src", "apps/api/tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
addopts = ["--import-mode=importlib"]
