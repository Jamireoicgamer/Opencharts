<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenChart</title>
    <link rel="stylesheet" href="start.css" />
    <script src="start.js" defer></script>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"></div>
      <h1>OpenChart</h1>
      <p id="status" role="status">Starting OpenChart on this computer…</p>
      <div id="problem" hidden>
        <p id="message"></p>
        <p class="hint">
          Quit OpenChart and open it again. If it still won&rsquo;t start, the log files named above
          explain why; please include them if you report a problem.
        </p>
      </div>
    </main>
  </body>
</html>
