[package]
name = "openchart-desktop"
description = "OpenChart AI for Windows and macOS"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
openchart-supervisor = { path = "../supervisor" }
serde_json = "=1.0.154"
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-updater = "=2.14.0"
