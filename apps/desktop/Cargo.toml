# The desktop app: a Tauri window over a bundled Postgres and the frozen API.
[workspace]
resolver = "3"
members = ["supervisor", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.85"
publish = false

[profile.release]
codegen-units = 1
lto = true
strip = true
