[project]
name = "openchart-api"
version = "0.1.0"
description = "OpenChart AI HTTP API"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "asyncpg>=0.29",
    "cryptography>=43",
    "fastapi>=0.115",
    "httpx2>=2.13",
    "pyjwt[crypto]>=2.15.1",
    "pyotp>=2.9",
    "pydantic-settings>=2.4",
    "segno>=1.6",
    "sqlalchemy[asyncio]>=2.0.30",
    "uvicorn[standard]>=0.30",
    "webauthn>=2.5",
]

[project.scripts]
openchart-api = "openchart_api.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
