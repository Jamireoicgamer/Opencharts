name: Desktop app

# Builds the Windows and macOS app, and smoke-tests its stack on each
# platform. A `desktop-v*` tag also makes a draft GitHub release; nothing is
# published until a maintainer publishes that draft.
#
# Optional settings (the build works without them, unsigned):
#   vars.TAURI_UPDATER_PUBKEY + secrets.TAURI_SIGNING_PRIVATE_KEY
#     (+ TAURI_SIGNING_PRIVATE_KEY_PASSWORD): signed automatic updates
#   secrets.APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
#     APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID:
#     a signed and notarised macOS app
# See docs/guides/desktop.md.

on:
  push:
    branches: [main]
    tags: ['desktop-v*']
    paths:
      - 'apps/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'pnpm-lock.yaml'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'apps/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'pnpm-lock.yaml'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel Macs are left out for now: the frozen API's cryptography
          # library needs a newer OpenSSL than the one PyInstaller bundles
          # there (missing SSL_get0_group_name). See docs/ROADMAP.md.
          - name: Windows (x64)
            os: windows-latest
            platform: windows-x86_64
            exe: .exe
          - name: macOS (Apple silicon)
            os: macos-latest
            platform: darwin-aarch64
            exe: ''
    defaults:
      run:
        shell: bash
    env:
      EXE: ${{ matrix.exe }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.13'
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen --group desktop
      - name: Build the web app
        run: pnpm --filter @opencharts/web build
      - name: Freeze the API
        run: uv run python apps/api/scripts/freeze.py
      - name: Stage PostgreSQL, the API and the web app
        run: pnpm --filter @opencharts/desktop stage

      - name: Unit tests
        working-directory: apps/desktop
        run: cargo test --locked
      - name: System keychain round trip
        working-directory: apps/desktop
        timeout-minutes: 5
        run: cargo test --locked -p openchart-supervisor -- --ignored keychain

      - name: Smoke test the stack (fresh install, live price, restart)
        timeout-minutes: 10
        run: |
          cargo build --locked --release -p openchart-supervisor --manifest-path apps/desktop/Cargo.toml
          data="$RUNNER_TEMP/openchart-data"
          postgres=apps/desktop/build/postgres
          if [ "$RUNNER_OS" = Windows ]; then
            # The installed app gets its folder as a verbatim \\?\C:\... path,
            # which initdb can't use as is; test with one, as the app does.
            postgres="\\\\?\\$(cygpath -w "$PWD/$postgres")"
          fi
          uv run python apps/desktop/scripts/smoke.py -- \
            "apps/desktop/target/release/openchart-stack$EXE" \
            --postgres "$postgres" \
            --api "apps/desktop/build/api/openchart-api$EXE" \
            --web apps/desktop/build/web \
            --data "$data" \
            --secrets-file "$data/secrets.json"
      - name: Upload the logs if the smoke test failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-logs-${{ matrix.platform }}
          path: ${{ runner.temp }}/openchart-data/logs/

      - name: Build the installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Unset signing variables would make the Tauri CLI try to sign.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID TAURI_SIGNING_PRIVATE_KEY \
                      TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            [ -n "${!name}" ] || unset "$name"
          done
          config='{}'
          if [ -n "$UPDATER_PUBKEY" ] && [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            config=$(node -e '
              const [key, repo] = process.argv.slice(1);
              console.log(JSON.stringify({
                bundle: { createUpdaterArtifacts: true },
                plugins: { updater: {
                  pubkey: key,
                  endpoints: [`https://github.com/${repo}/releases/latest/download/latest.json`],
                } },
              }));' "$UPDATER_PUBKEY" "$GITHUB_REPOSITORY")
          fi
          pnpm --filter @opencharts/desktop tauri build --ci --config "$config"
      - name: Collect the installers
        run: |
          out="$RUNNER_TEMP/installers/${{ matrix.platform }}"
          mkdir -p "$out"
          bundle=apps/desktop/target/release/bundle
          find "$bundle" -maxdepth 2 -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.sig' \) \
            -exec cp {} "$out/" \;
          # Both macOS builds name their update bundle OpenChart.app.tar.gz.
          for file in "$out"/*.app.tar.gz*; do
            [ -e "$file" ] || continue
            mv "$file" "$out/OpenChart_${{ matrix.platform }}.${file##*/OpenChart.}"
          done
          ls -la "$out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openchart-${{ matrix.platform }}
          path: ${{ runner.temp }}/installers/${{ matrix.platform }}/
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: installers
          pattern: openchart-*
      - name: Write latest.json for the updater
        id: updater
        env:
          UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          # Without an update key there are no signed bundles and no updates.
          if [ -n "$UPDATER_PUBKEY" ]; then
            node apps/desktop/scripts/latest-json.mjs installers \
              "${GITHUB_REF_NAME#desktop-v}" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" \
              > latest.json
            echo "file=latest.json" >> "$GITHUB_OUTPUT"
          fi
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.updater.outputs.file }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "OpenChart desktop ${GITHUB_REF_NAME#desktop-v}" \
            --notes "Windows and macOS installers. See docs/guides/desktop.md to install." \
            installers/*/* $LATEST
