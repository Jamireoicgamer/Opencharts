# Serves the web app and proxies /api to the API container.
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 1m;

    # Security headers. Locations below must not use add_header, or nginx
    # stops inheriting these.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=()" always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        # Replace, never append to, whatever the client sent.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed build assets never change.
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
