# Serves the web app and proxies /api to the API container.
# Runs as an unprivileged user, so it listens on 8080 inside the container.

# Second line of defence for the endpoints that check passwords, codes,
# passkeys or the setup token; the API has its own failure limits too.
limit_req_zone $binary_remote_addr zone=openchart_auth:1m rate=10r/m;
limit_req_status 429;

server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 1m;

    # Security headers. Locations below must not use add_header, or nginx
    # stops inheriting these.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=()" always;

    location ~ ^/api/(setup|auth/(login|register|reauth|passkey|mfa/[a-z]+))$ {
        limit_req zone=openchart_auth burst=10 nodelay;
        include /etc/nginx/openchart-proxy.conf;
    }

    # Live prices: a long-lived WebSocket. The API pings it, so a quiet
    # connection still sees traffic well within the read timeout.
    location = /api/market/stream {
        # Same as openchart-proxy.conf, with WebSocket upgrade and long timeouts.
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /api/ {
        include /etc/nginx/openchart-proxy.conf;
    }

    # Hashed build assets never change.
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    # Not in every nginx's MIME table; browsers want the right type.
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        expires -1;
    }

    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
